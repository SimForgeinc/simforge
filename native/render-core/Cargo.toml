[package]
name = "render-core"
version.workspace = true
edition.workspace = true

[[bin]]
name = "native-render"
path = "src/bin/native-render.rs"

[dependencies]
crossbeam-channel = "0.5"
bevy = { version = "0.19.1", default-features = true, features = ["png", "hdr", "ktx2", "debug", "tonemapping_luts"] }
image = "0.25"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
sha2 = "0.10"

[features]
default = ["pcss"]
# PCSS soft shadows (lighting ladder rung 4)
pcss = ["bevy/experimental_pbr_pcss"]
# Solari raytraced GI (rung 5) — optional RT-hardware quality tier
solari = ["bevy/bevy_solari"]
