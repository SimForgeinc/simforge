[package]
name = "render-core"
version.workspace = true
edition.workspace = true

[[bin]]
name = "native-render"
path = "src/bin/native-render.rs"

[dependencies]
crossbeam-channel = "0.5"
bevy = { version = "0.19.1", default-features = true, features = ["png", "hdr", "ktx2", "debug", "tonemapping_luts"] }
image = "0.25"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
