[project]
name = "bridge-student"
version = "0.1.0"
description = "WS3 bridge student: few-step conditional student, trace-derived G-buffers, frozen-perception auto-reject auditor"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "pyyaml>=6",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "diffusers>=0.31",
    "transformers>=4.44",
    "accelerate>=0.34",
    "safetensors>=0.4",
]
audit = [
    "opencv-python-headless>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge_student"]

[tool.uv]
package = true
