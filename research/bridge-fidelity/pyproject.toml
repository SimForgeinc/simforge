[project]
name = "bridge-fidelity"
version = "0.1.0"
description = "WS1 RealityAnchor: bridge-fidelity scorecard — detector-based paired metrics between translated engine frames and a frozen real-world eval corpus."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "ultralytics>=8.3",
    "tqdm>=4.66",
]

[project.scripts]
bf-build-corpus = "bridge_fidelity.build_corpus:main"
bf-scorecard = "bridge_fidelity.score:main"
bf-fetch-images = "bridge_fidelity.fetch_images:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge_fidelity"]

[tool.uv]
# CPU-only torch: the metric instrument must be host-independent; inference
# cost is trivial (a few thousand frames) and GPU rasterization differences
# would only add nondeterminism to the instrument itself.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
