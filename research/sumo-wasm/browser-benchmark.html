<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>UniScenarios SUMO-WASM worker benchmark</title>
<style>
  body { margin: 2rem; font: 14px/1.5 ui-monospace, monospace; background: #111827; color: #e5e7eb; }
  pre { white-space: pre-wrap; }
</style>
<h1>SUMO-WASM worker benchmark</h1>
<pre id="status">Starting…</pre>
<script type="module">
const status = document.querySelector('#status');
const actors = Number(new URL(location.href).searchParams.get('actors') || 100);
const worker = new Worker('./browser-benchmark-worker.mjs', { type: 'module' });
const frameTimes = [];
let previousFrame = performance.now();
let running = true;
function frame(now) {
  frameTimes.push(now - previousFrame);
  previousFrame = now;
  if (running) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
worker.onmessage = ({ data }) => {
  if (data.kind === 'progress') status.textContent = data.message;
  if (data.kind === 'result') {
    running = false;
    const stableFrames = frameTimes.slice(5);
    const report = {
      ...data.report,
      mainFrameP95Milliseconds: percentile(stableFrames, 0.95),
      mainFrameP99Milliseconds: percentile(stableFrames, 0.99),
      mainFramesPerSecond: 1000 / (stableFrames.reduce((a, b) => a + b, 0) / stableFrames.length),
    };
    status.textContent = JSON.stringify(report, null, 2);
    document.title = 'PASS SUMO-WASM benchmark';
    worker.terminate();
  }
  if (data.kind === 'error') {
    running = false;
    status.textContent = `ERROR\n${data.message}`;
    document.title = 'FAIL SUMO-WASM benchmark';
  }
};
worker.postMessage({ kind: 'run', actors, moduleUrl: './sumo.mjs', networkUrl: './grid.net.xml' });

function percentile(values, fraction) {
  const ordered = [...values].sort((a, b) => a - b);
  return ordered[Math.min(ordered.length - 1, Math.floor(ordered.length * fraction))];
}
</script>
</html>
