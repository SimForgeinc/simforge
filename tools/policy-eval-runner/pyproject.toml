[project]
name = "policy-eval-runner"
version = "0.1.0"
description = "WS5 EvalHarness runner: executes policies over the frozen policy-eval-suite.v1 with deployment perturbations, computes Bench2Drive-style ability decomposition, and gates against pinned baselines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "msgpack>=1.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Needed only to evaluate trained PPO checkpoints (`--checkpoint`);
# the authored-choreography baseline runs without torch.
policy = ["torch>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["policy_eval_runner"]
