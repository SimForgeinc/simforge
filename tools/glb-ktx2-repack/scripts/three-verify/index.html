<!doctype html>
<!--
  Three.js load-verification harness for repacked KTX2 GLBs.

  Mirrors the production viewer wiring (apps/web city-viewer streaming
  tile-loader in deploy-build): GLTFLoader + KTX2Loader (basis transcoder)
  + MeshoptDecoder. Serve a web root that maps /node_modules to the repo
  node_modules and /out to the repacked tiles, then open
  index.html?glb=/out/<file>.glb . Results land in window.__result.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>body { margin: 0; background: #202830; }</style>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
      import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

      const params = new URLSearchParams(location.search);
      const glb = params.get('glb');
      const width = 960;
      const height = 540;
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(width, height);
      renderer.toneMapping = THREE.AgXToneMapping;
      document.body.appendChild(renderer.domElement);

      const ktx2 = new KTX2Loader().setTranscoderPath('/node_modules/three/examples/jsm/libs/basis/').detectSupport(renderer);
      const loader = new GLTFLoader().setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder);

      try {
        const gltf = await loader.loadAsync(glb);
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87a8c8);
        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const sun = new THREE.DirectionalLight(0xffffff, 2.5);
        sun.position.set(1, 2, 1);
        scene.add(sun);
        scene.add(gltf.scene);

        const box = new THREE.Box3().setFromObject(gltf.scene);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3()).length();
        const camera = new THREE.PerspectiveCamera(50, width / height, size / 1000, size * 4);
        camera.position.copy(center).add(new THREE.Vector3(size * 0.18, size * 0.12, size * 0.18));
        camera.lookAt(center);

        const textures = new Set();
        let compressed = 0;
        gltf.scene.traverse((node) => {
          const material = node.material;
          if (!material) return;
          for (const value of Object.values(material)) {
            if (value && value.isTexture && !textures.has(value)) {
              textures.add(value);
              if (value.isCompressedTexture) compressed++;
            }
          }
        });
        renderer.render(scene, camera);
        window.__result = {
          ok: true,
          meshes: gltf.scene.getObjectsByProperty('isMesh', true).length,
          textures: textures.size,
          compressedTextures: compressed,
          sampleFormat: [...textures][0]?.format ?? null,
        };
      } catch (err) {
        window.__result = { ok: false, error: String(err?.message ?? err) };
      }
      document.body.dataset.done = '1';
    </script>
  </body>
</html>
