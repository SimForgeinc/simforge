name: Publish immutable SimForge stack

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install schema and video tools
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Install the browser renderer runtime
        run: pnpm --filter @simforge-oss/render exec playwright-core install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm test:release
      - run: pnpm test:integration
      - run: pnpm test:portable
      - run: pnpm release:manifest
      - run: pnpm release:verify-artifacts
      - run: pnpm release:smoke-packages
      - name: Verify tag and publish with npm provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('config/simforge-oss-stack.json'));if(process.env.GITHUB_REF_NAME!=='v'+c.stackVersion)throw new Error('tag must equal v'+c.stackVersion)"
          pnpm --filter "./packages/*" publish --recursive --access public --provenance --no-git-checks

  publish-carla-exec:
    needs: publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema and video tools
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils ffmpeg
      - name: Verify release identity
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          config = json.loads(pathlib.Path("config/simforge-oss-stack.json").read_text())
          expected = "v" + config["stackVersion"]
          assert os.environ["GITHUB_REF_NAME"] == expected, f"tag must equal {expected}"
          entry = next(item for item in config["pythonPackages"] if item["path"] == "adapters/carla-exec")
          assert entry["name"] == "simforge-oss-carla-exec"
          project = pathlib.Path(entry["path"], "pyproject.toml").read_text()
          version = re.search(r'^version = "([^"]+)"', project, re.MULTILINE).group(1)
          assert version == entry["version"] == config["stackVersion"].replace("-rc.", "rc")
          PY
      - name: Test and build public CARLA execution adapter
        run: |
          python -m pip install "build==1.3.0" "./adapters/carla-exec[dev]"
          python -m pytest adapters/carla-exec/tests -q
          python -m build adapters/carla-exec
          python -m venv /tmp/simforge-oss-carla-exec-smoke
          /tmp/simforge-oss-carla-exec-smoke/bin/python -m pip install adapters/carla-exec/dist/*.whl
          /tmp/simforge-oss-carla-exec-smoke/bin/python -c "import simforge_oss_carla_exec"
      - name: Publish immutable PyPI artifacts with provenance
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: adapters/carla-exec/dist/
          attestations: true
