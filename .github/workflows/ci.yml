name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install OpenSCENARIO schema validator
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:naming
      - run: pnpm typecheck
      - run: pnpm test:release
      - run: pnpm test:integration
      - run: pnpm test:portable
      - run: pnpm release:manifest
      - run: pnpm release:verify-artifacts
      - run: pnpm release:smoke-packages

  carla-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CARLA bridge system dependencies
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg libxml2-utils
      - name: Test and smoke-install public CARLA adapter
        run: |
          python -m pip install "build==1.3.0" "./adapters/carla-bridge[dev]"
          python -m pytest adapters/carla-bridge/tests -q
          python -m build adapters/carla-bridge
          python -m venv /tmp/uniscenarios-carla-smoke
          /tmp/uniscenarios-carla-smoke/bin/python -m pip install adapters/carla-bridge/dist/*.whl
          /tmp/uniscenarios-carla-smoke/bin/uniscenarios-carla --help
