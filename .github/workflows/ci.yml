name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install schema and video tools
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Install the browser renderer runtime
        run: pnpm --filter @simforge-oss/render exec playwright install --with-deps chromium
      - name: Smoke Meshy generation contract
        run: pnpm meshy:smoke
      - name: Smoke Meshy API authentication when configured
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: pnpm meshy:smoke:live
      - run: pnpm verify:naming
      - run: pnpm typecheck
      - run: pnpm test:release
      - run: pnpm test:integration
      - run: pnpm test:portable
      - run: pnpm release:manifest
      - run: pnpm release:verify-artifacts
      - run: pnpm release:smoke-packages

  carla-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema and video tools
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils ffmpeg
      - name: Test and smoke-install public CARLA adapter
        run: |
          python -m pip install "build==1.3.0" "./adapters/carla-exec[dev]"
          python -m pytest adapters/carla-exec/tests -q
          python -m build adapters/carla-exec
          python -m venv /tmp/simforge-carla-smoke
          /tmp/simforge-carla-smoke/bin/python -m pip install adapters/carla-exec/dist/*.whl
          /tmp/simforge-carla-smoke/bin/simforge-oss-carla-api --help
