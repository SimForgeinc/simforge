[project]
name = "uniscenarios-carla-bridge"
version = "0.1.0rc47"
description = "Optional local CARLA renderer, sensor, and deterministic conformance adapter for UniScenarios"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "SimForge" }]
dependencies = []

[project.urls]
Repository = "https://github.com/SimForgeinc/UniScenarios"

[project.scripts]
uniscenarios-carla = "uniscenarios_carla_bridge.local:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uniscenarios_carla_bridge"]

[tool.hatch.build.targets.sdist]
include = ["uniscenarios_carla_bridge", "tests", "README.md", "Dockerfile", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
