[project]
name = "simforge-oss-carla-api"
version = "0.1.0rc51"
description = "CARLA-compatible Python API facade over the SimForge env-server and render path"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "msgpack>=1.0",
    "numpy>=1.26",
]
[project.optional-dependencies]
dev = ["pytest>=8"]

# Drop-in ecosystem shim: `import carla` resolves to this facade.
[tool.uv]
# nothing special; plain project

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simforge_oss_carla_api", "carla"]
