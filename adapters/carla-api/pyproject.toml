[project]
name = "uniscenarios-carla"
version = "0.1.0"
description = "CARLA-compatible Python API facade over the UniScenarios env-server and render path"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "msgpack>=1.0",
    "numpy>=1.26",
]
[project.optional-dependencies]
dev = ["pytest>=8"]

# Drop-in ecosystem shim: `import carla` resolves to this facade.
[tool.uv]
# nothing special; plain project

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uniscenarios_carla", "carla"]
