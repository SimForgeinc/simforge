[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simforge-oss-policy-runner"
version = "0.1.0"
description = "Reference policy_step client: seeded episodes, deadline accounting, digested JSONL traces."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "msgpack>=1.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]

[project.scripts]
simforge-oss-policy-runner = "simforge_oss_policy_runner.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["simforge_oss_policy_runner"]
