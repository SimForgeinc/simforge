simforge_bridge:
  ros__parameters:
    # Episode spec consumed by the env-server (path resolved by the launcher).
    episodes: ""
    seed: "ros2-bridge"
    session: 0

    # Lockstep policy: the sim advances only when a fresh command arrives on
    # control_topic, or after control_timeout_s wall seconds pass.
    control_topic: "/simforge/control/ackermann"
    control_timeout_s: 2.0
    first_command_timeout_s: 30.0
    timeout_policy: "hold"        # hold | authored
    max_ticks: 0                  # 0 = run to termination/truncation

    # AckermannDriveStamped -> EnvAction mapping.
    control_mode: "passthrough"   # passthrough (pedals+steer) | setpoint (speed/accel, authored steering)
    max_steer_rad: 0.6            # Ackermann steering_angle at full engine steer
    steer_sign: 1.0               # +1: positive angle = left = +yaw (verified against dynamic-v1)
    speed_kp: 1.2                 # speed error -> accel when drive.acceleration == 0
    max_accel_mps2: 3.0
    max_decel_mps2: 6.0

    frame_map: "map"
    frame_base: "base_link"

    # Per-episode rosbag (sqlite3) directory; empty disables recording.
    bag_dir: ""
    # Episode summary JSON (seed, ticks, trace digest); empty disables.
    meta_path: ""
    clock_keepalive_s: 0.25
