[project]
name = "simforge-oss-gym"
version = "0.1.0rc61"
description = "Gymnasium client for the SimForge deterministic env-server (simforge-env-server)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "SimForge" }]
dependencies = [
    "gymnasium>=1.0",
    "msgpack>=1.0",
    "numpy>=1.24",
]

[project.urls]
Repository = "https://github.com/SimForgeinc/simforge-oss"

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simforge_oss_gym"]

[tool.hatch.build.targets.sdist]
include = ["simforge_oss_gym", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
