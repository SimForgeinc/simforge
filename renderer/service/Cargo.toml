[package]
name = "service"
version.workspace = true
edition.workspace = true

[[bin]]
name = "native-render-service"
path = "src/bin/native-render-service.rs"

[dependencies]
render-core = { path = "../render-core" }
anyhow = "1"
crc32fast = "1"
image = "0.25"
memmap2 = "0.9"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
