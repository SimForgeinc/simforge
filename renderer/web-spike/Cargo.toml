# NON-PRODUCT feasibility spike (lane sf-wasmgate). Excluded from the renderer
# workspace on purpose; nothing here ships. See README.md.
[package]
name = "web-spike"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "rlib"]

# Standalone workspace so `cargo build` here never drags the product renderer in
# (and vice versa: renderer/Cargo.toml excludes web-spike).
[workspace]

[dependencies]
wgpu = "30"
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Response", "HtmlCanvasElement", "Performance", "console"] }
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ktx2 = "0.5"
ruzstd = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
console_error_panic_hook = "0.1"
futures-channel = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
