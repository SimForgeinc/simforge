[package]
name = "render-core"
version.workspace = true
edition.workspace = true

[[bin]]
name = "native-render"
path = "src/bin/native-render.rs"

[[bin]]
name = "scen-play"
path = "src/bin/scen-play.rs"

[[bin]]
name = "native-render-job"
path = "src/bin/native-render-job.rs"

[[bin]]
name = "parity-check"
path = "src/bin/parity-check.rs"

[[bin]]
name = "sky-bench"
path = "src/bin/sky-bench.rs"

[dependencies]
crossbeam-channel = "0.5"
# `basis-universal` transcodes UASTC/ETC1S KTX2 (glb-ktx2-repack output) to GPU formats at load.
# The source map GLBs use specular, anisotropy, clearcoat, and (potentially) transmission
# textures. Bevy gates those texture bindings behind explicit features; omitting them
# silently drops authored PBR inputs.
bevy = { version = "0.19.1", default-features = true, features = [
  "png",
  "jpeg",
  "hdr",
  "ktx2",
  "basis-universal",
  "debug",
  "tonemapping_luts",
  "pbr_light_textures",
  "pbr_specular_textures",
  "pbr_anisotropy_texture",
  "pbr_multi_layer_material_textures",
  "pbr_transmission_textures",
] }
image = "0.25"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

sha2 = "0.10"

[features]
default = ["pcss"]
# PCSS soft shadows (lighting ladder rung 4)
pcss = ["bevy/experimental_pbr_pcss"]
# Solari raytraced GI (rung 5) — optional RT-hardware quality tier
solari = ["bevy/bevy_solari"]
