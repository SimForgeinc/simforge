<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>prop-catalog contact sheet</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1d2024;
        --muted: #6b7178;
        --line: #d9d7d1;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: #f3f2ee;
        color: var(--ink);
        font: 13px/1.35 -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #sheet { position: relative; }
      #gl { position: absolute; inset: 0; display: block; }
      #overlay { position: relative; }
      .header {
        position: absolute;
        left: 0;
        top: 0;
        padding: 26px 28px 0;
      }
      .header h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .header p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .cell {
        position: absolute;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
        pointer-events: none;
      }
      .cell .caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 52px;
        padding: 7px 10px;
        background: rgba(243, 242, 238, 0.94);
        border-top: 1px solid var(--line);
      }
      .cell .name {
        font-weight: 600;
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        white-space: nowrap;
      }
      .cell .name > span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cell .name .dims { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
      .cell .id {
        color: var(--muted);
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        margin-top: 3px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        white-space: nowrap;
      }
      .cell .id > span:first-child { flex: 0 0 auto; }
      .cell .id > span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 10px;
      }
      .cell .tags { color: #98999a; }
      .section {
        position: absolute;
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="sheet">
      <canvas id="gl"></canvas>
      <div id="overlay"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
